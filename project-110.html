<!-- The HTML Document Object Model (DOM) organizes web pages into 
 a tree structure composed of parent and child elements. In my project,
the section tag with id="pictures" acts as a parent container that 
holds three figure elements as its direct children. Furthermore, each
figure element serves as a parent to an img tag and a figcaption element
nested inside it. Similarly, the main element acts as the top-level parent
container for all content sections on the page. -->
